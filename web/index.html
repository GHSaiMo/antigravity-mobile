<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Antigravity" />
  <meta name="theme-color" content="#0f172a" />
  <title>Antigravity</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="btn-back" class="btn-icon hidden" aria-label="返回列表">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="brand">
          <img src="/icons/icon-192.png" class="app-logo" alt="Logo" />
          <div class="brand-text">
            <h1 id="header-title">Antigravity</h1>
            <span id="header-subtitle" class="subtitle"></span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div id="conn-pill" class="status-pill disconnected" title="点击重新探测服务">
          <span class="dot"></span>
          <span class="status-text">连接中...</span>
        </div>
        <button id="btn-new" class="btn-icon btn-primary-icon" aria-label="新建会话">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-container">
      <!-- View 1: Conversations List -->
      <section id="view-conversations" class="view active">
        <div class="list-toolbar">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="conv-search" placeholder="搜索会话..." autocomplete="off" />
          </div>
          <button id="btn-refresh" class="btn-icon" aria-label="刷新列表">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>

        <div id="conversations-list" class="conversations-grid">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>正在加载会话列表...</p>
          </div>
        </div>
      </section>

      <!-- View 2: Chat View -->
      <section id="view-chat" class="view">
        <div class="chat-subhead">
          <div class="chat-subhead-info">
            <span id="chat-workspace-name" class="workspace-tag">工作区</span>
            <span id="chat-status-badge" class="badge-idle">IDLE</span>
          </div>
          <button id="btn-cancel-task" class="btn-danger-sm hidden">停止任务</button>
        </div>

        <div id="messages-stream" class="messages-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>正在拉取历史步骤...</p>
          </div>
        </div>

        <!-- Sticky Chat Input Bar -->
        <div class="chat-input-bar">
          <div class="input-wrapper">
            <textarea id="chat-input" placeholder="输入对 Agent 的指令..." rows="1"></textarea>
            <button id="btn-send" class="btn-send" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Modal: New Conversation -->
    <div id="modal-new" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h2>新建 Agent 会话</h2>
          <button id="btn-close-modal" class="btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="new-workspace-select">目标项目 / 工作区</label>
            <select id="new-workspace-select">
              <option value="">正在嗅探上游项目...</option>
            </select>
            <input type="text" id="new-workspace" placeholder="或输入自定义工作区绝对路径..." style="margin-top: 6px; font-size: 13px;" />
          </div>
          <div class="form-group">
            <label for="new-model">选择模型</label>
            <select id="new-model">
              <option value="">默认模型</option>
            </select>
          </div>
          <div class="form-group">
            <label for="new-prompt">首条指令 / 任务目标</label>
            <textarea id="new-prompt" rows="3" placeholder="例如：审查代码规范并运行测试..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-modal-cancel" class="btn-secondary">取消</button>
          <button id="btn-modal-create" class="btn-primary">开始执行</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js?v=2"></script>
</body>
</html>
