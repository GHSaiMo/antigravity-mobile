<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Antigravity" />
  <meta name="theme-color" content="#000000" />
  <title>Antigravity</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css?v=6" />
</head>
<body>
  <div id="app">
    <!-- iOS Navigation Bar -->
    <header class="ios-navbar" id="ios-navbar">
      <div class="nav-left">
        <!-- In List View: Settings Button -->
        <button id="btn-settings" class="nav-btn" aria-label="设置">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <!-- In Chat View: Back Button with Chevron -->
        <button id="btn-back" class="nav-btn nav-back-btn hidden" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span class="back-title">Antigravity</span>
        </button>
      </div>

      <div class="nav-center">
        <div id="nav-inline-title" class="nav-inline-title hidden">
          <span id="chat-title-text" class="title-text">会话详情</span>
          <span id="chat-workspace-text" class="subtitle-text"></span>
        </div>
      </div>

      <div class="nav-right">
        <!-- In List View: Plus Button -->
        <button id="btn-new" class="nav-btn nav-action-btn" aria-label="新建会话">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <!-- In Chat View: Status indicator -->
        <div id="chat-status-dot" class="chat-status-dot hidden" title="上游状态"></div>
      </div>
    </header>

    <!-- Main Views Container -->
    <main class="content-container">
      <!-- View 1: iOS Conversation List -->
      <section id="view-conversations" class="view active">
        <!-- Large Title (iOS NavigationStack Style) -->
        <div class="ios-large-title-bar">
          <h1 class="large-title">Antigravity</h1>
        </div>

        <!-- iOS .searchable Search Bar -->
        <div class="ios-search-bar">
          <div class="search-capsule">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="conv-search" placeholder="搜索会话或工作区..." autocomplete="off" />
            <button id="btn-search-clear" class="search-clear-btn hidden" aria-label="清空搜索">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15" stroke="var(--ios-bg)" stroke-width="2" stroke-linecap="round"></line>
                <line x1="9" y1="9" x2="15" y2="15" stroke="var(--ios-bg)" stroke-width="2" stroke-linecap="round"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Conversations List (iOS Inset Plain List) -->
        <div id="conversations-list" class="conversations-list">
          <div class="loading-state">
            <div class="ios-spinner"></div>
            <p>正在连接 Agent...</p>
          </div>
        </div>
      </section>

      <!-- View 2: iOS Chat View -->
      <section id="view-chat" class="view">
        <div id="messages-stream" class="messages-container">
          <div class="loading-state">
            <div class="ios-spinner"></div>
            <p>正在同步会话历史与步骤...</p>
          </div>
        </div>

        <!-- Floating Interaction Card (Permissions / Choices) -->
        <div id="interaction-card-container" class="interaction-card-container hidden"></div>

        <!-- Sticky iOS Chat Input Bar -->
        <div class="ios-input-bar">
          <!-- Quick Action Chips (Commit & Push, Proceed) -->
          <div class="quick-actions-chips" id="quick-actions-bar">
            <button id="btn-commit-push" class="chip-pill" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="18" r="3"></circle>
                <circle cx="6" cy="6" r="3"></circle>
                <path d="M13 6h3a2 2 0 0 1 2 2v7"></path>
                <line x1="6" y1="9" x2="6" y2="21"></line>
              </svg>
              <span>Commit and Push</span>
            </button>
            <button id="btn-proceed" class="chip-pill chip-proceed hidden" type="button">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Proceed</span>
            </button>
          </div>

          <!-- Input Row: Capsule Textfield + 44x44 Circle Send/Stop Button -->
          <div class="input-row">
            <div class="textfield-wrapper">
              <textarea id="chat-input" placeholder="发送对 Agent 的指令..." rows="1"></textarea>
            </div>
            <button id="btn-send" class="btn-action-circle send-mode" aria-label="发送">
              <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
              <svg class="icon-stop hidden" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <rect x="5" y="5" width="14" height="14" rx="2"></rect>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- iOS Bottom Sheet: New Conversation -->
    <div id="sheet-new" class="ios-sheet-overlay hidden">
      <div class="ios-sheet-card">
        <div class="sheet-grabber"></div>
        <div class="sheet-header">
          <button id="btn-sheet-new-cancel" class="sheet-header-btn">取消</button>
          <h2 class="sheet-title">新建会话</h2>
          <button id="btn-sheet-new-create" class="sheet-header-btn primary">开始执行</button>
        </div>
        <div class="sheet-body">
          <div class="ios-grouped-section">
            <div class="ios-cell">
              <label for="new-workspace-select">工作区</label>
              <select id="new-workspace-select">
                <option value="">正在嗅探项目...</option>
              </select>
            </div>
            <div class="ios-cell">
              <input type="text" id="new-workspace" placeholder="或输入工作区绝对路径..." />
            </div>
          </div>

          <div class="ios-grouped-section">
            <div class="ios-cell">
              <label for="new-model">模型</label>
              <select id="new-model">
                <option value="">默认模型</option>
              </select>
            </div>
          </div>

          <div class="ios-grouped-section">
            <div class="ios-cell no-padding">
              <textarea id="new-prompt" rows="4" placeholder="输入首条指令，例如：审查代码规范并运行测试..."></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- iOS Bottom Sheet: Settings & Gateway Status -->
    <div id="sheet-settings" class="ios-sheet-overlay hidden">
      <div class="ios-sheet-card">
        <div class="sheet-grabber"></div>
        <div class="sheet-header">
          <div style="width: 50px;"></div>
          <h2 class="sheet-title">网关与服务</h2>
          <button id="btn-sheet-settings-done" class="sheet-header-btn primary">完成</button>
        </div>
        <div class="sheet-body">
          <div class="ios-grouped-section">
            <div class="ios-cell between">
              <span class="cell-label">网关状态</span>
              <span id="settings-status-pill" class="status-badge connected">已连接</span>
            </div>
            <div class="ios-cell between">
              <span class="cell-label">上游端口</span>
              <span id="settings-upstream-port" class="cell-value monospaced">-</span>
            </div>
            <div class="ios-cell between">
              <span class="cell-label">进程 PID</span>
              <span id="settings-upstream-pid" class="cell-value monospaced">-</span>
            </div>
            <div class="ios-cell between">
              <span class="cell-label">CSRF Token</span>
              <span id="settings-csrf-token" class="cell-value monospaced text-ellipsis">-</span>
            </div>
          </div>

          <div class="ios-grouped-section">
            <button id="btn-rescan-gateway" class="ios-cell-button">
              <span>重新嗅探 Antigravity 实例</span>
            </button>
          </div>

          <div class="ios-grouped-section">
            <div class="ios-cell between">
              <span class="cell-label">直连 IPv6</span>
              <span class="cell-value monospaced" style="font-size: 11px;">240e:3a1:1c3:4e80::</span>
            </div>
            <div class="ios-cell between">
              <span class="cell-label">客户端模式</span>
              <span class="cell-value">Web / PWA (IPv6 直连)</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js?v=6"></script>
</body>
</html>
