name: Release Multigravity

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. 构建 Android APK (已配置 debug 自签，用户可直接点击安装)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd android
          echo "android.useAndroidX=true" >> gradle.properties
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ inputs.tag || 'v1.0.0' }}"
          fi
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到构建好的 APK 文件"
            exit 1
          fi
          cp "$APK_PATH" "dist/Multigravity-${TAG_NAME}.apk"
          echo "✅ 成功生成 APK 资产: dist/Multigravity-${TAG_NAME}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  # ============================================================================
  # 2. 构建 macOS Universal 通用二进制 (Apple Silicon + Intel Mac)
  # ============================================================================
  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build macOS Binaries (arm64, amd64 & Universal)
        run: |
          mkdir -p dist/arm64 dist/amd64 dist/universal
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ inputs.tag || '1.0.0' }}"
          fi
          VERSION_NUM="${TAG_NAME#v}"

          # 1. 编译 Apple Silicon (M系列)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/arm64/mgy ./cmd/gateway
          # 2. 编译 Intel Mac (x86_64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/amd64/mgy ./cmd/gateway

          # 3. 合成 Universal 二进制
          lipo -create -output dist/universal/mgy dist/arm64/mgy dist/amd64/mgy
          chmod +x dist/arm64/mgy dist/amd64/mgy dist/universal/mgy

          # 4. 消除隔离并执行 Ad-hoc 签名
          codesign -s - -f dist/arm64/mgy || true
          codesign -s - -f dist/amd64/mgy || true
          codesign -s - -f dist/universal/mgy || true

      - name: Package macOS Tarballs
        run: |
          tar -czf dist/multigravity-darwin-arm64.tar.gz -C dist/arm64 mgy
          tar -czf dist/multigravity-darwin-amd64.tar.gz -C dist/amd64 mgy
          tar -czf dist/multigravity-darwin-universal.tar.gz -C dist/universal mgy

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/multigravity-darwin-*.tar.gz

  # ============================================================================
  # 3. 构建 Windows 二进制 (amd64)
  # ============================================================================
  build-windows:
    name: Build Windows Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Windows Binaries
        run: |
          mkdir -p dist/amd64 dist/out
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ inputs.tag || '1.0.0' }}"
          fi
          VERSION_NUM="${TAG_NAME#v}"

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/amd64/mgy.exe ./cmd/gateway

          (cd dist/amd64 && zip -q -9 ../out/multigravity-windows-amd64.zip mgy.exe)

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/out/multigravity-windows-*.zip

  # ============================================================================
  # 4. 聚合所有构建产物并发布 GitHub Release
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.0.0' }}
          name: "Multigravity ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.0.0' }}"
          body_path: .github/release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
