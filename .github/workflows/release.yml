name: Release Multigravity

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.2.8 or v1.2.8-beta.1)'
        required: false
        default: 'v1.2.7'
      prerelease:
        description: 'Mark as Pre-release (auto-enabled when tag contains "-")'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. 构建 Android Direct Release APK (私有密钥库由 GitHub Secrets 注入，支持覆盖升级与应用内自更新)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Decode Private Release Keystore
        env:
          MGY_ANDROID_KEYSTORE_BASE64: ${{ secrets.MGY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MGY_ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ 未配置 GitHub Actions Secret: MGY_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$MGY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mgy-release.jks"
          chmod 600 "$RUNNER_TEMP/mgy-release.jks"

      - name: Build Android Direct Release APK
        env:
          MGY_KEYSTORE_PATH: ${{ runner.temp }}/mgy-release.jks
          MGY_KEYSTORE_PASSWORD: ${{ secrets.MGY_ANDROID_KEYSTORE_PASSWORD }}
          MGY_KEY_ALIAS: ${{ secrets.MGY_ANDROID_KEY_ALIAS }}
          MGY_KEY_PASSWORD: ${{ secrets.MGY_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          echo "android.useAndroidX=true" >> gradle.properties
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDirectRelease --no-daemon

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mgy-release.jks"

      - name: Verify APK Release Signature
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/direct/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到构建好的 APK 文件"
            exit 1
          fi
          echo "🔍 正在校验 APK Release 签名证书指纹..."
          EXPECTED_SHA256="79d815b505c18144ae72e730380243a65bfdc63d5e134e7770eb3d902d355ca9"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "❌ 未找到 apksigner 工具"
            exit 1
          fi
          CERT_DIGEST=$("$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "SHA-256 digest" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | head -n 1)
          echo "APK 实际指纹: $CERT_DIGEST"
          echo "预期固定指纹: $EXPECTED_SHA256"
          if [ "$CERT_DIGEST" != "$EXPECTED_SHA256" ]; then
            echo "❌ 签名指纹不匹配！禁止发布非统一签名的 APK！"
            exit 1
          fi
          echo "✅ 签名证书指纹校验通过！"

      - name: Prepare APK Asset
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME="${INPUT_TAG:-v1.2.7}"
          fi
          APK_PATH=$(find android/app/build/outputs/apk/direct/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到构建好的 APK 文件"
            exit 1
          fi
          cp "$APK_PATH" "dist/Multigravity-${TAG_NAME}.apk"
          echo "✅ 成功生成 APK 资产: dist/Multigravity-${TAG_NAME}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: dist/*.apk

  # ============================================================================
  # 2. 构建 macOS Universal 通用二进制 (Apple Silicon + Intel Mac)
  # ============================================================================
  build-macos:
    name: Build macOS Universal Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install llvm-lipo
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          LIPO=$(which llvm-lipo 2>/dev/null || ls /usr/bin/llvm-lipo* 2>/dev/null | head -n 1)
          if [ -n "$LIPO" ]; then
            sudo ln -sf "$LIPO" /usr/local/bin/llvm-lipo
          fi
          llvm-lipo --version

      - name: Build macOS Binaries (arm64, amd64 & Universal)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist/arm64 dist/amd64 dist/universal
          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME="${INPUT_TAG:-v1.2.7}"
          fi
          VERSION_NUM="${TAG_NAME#v}"

          # 1. 编译 Apple Silicon (M系列)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/arm64/mgy ./cmd/gateway
          # 2. 编译 Intel Mac (x86_64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/amd64/mgy ./cmd/gateway

          # 3. 合成 Universal 二进制
          llvm-lipo -create -output dist/universal/mgy dist/arm64/mgy dist/amd64/mgy
          chmod +x dist/arm64/mgy dist/amd64/mgy dist/universal/mgy

      - name: Package macOS Tarballs
        run: |
          tar -czf dist/multigravity-darwin-arm64.tar.gz -C dist/arm64 mgy
          tar -czf dist/multigravity-darwin-amd64.tar.gz -C dist/amd64 mgy
          tar -czf dist/multigravity-darwin-universal.tar.gz -C dist/universal mgy

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal
          path: dist/multigravity-darwin-*.tar.gz

  # ============================================================================
  # 3. 构建 Windows 二进制 (amd64)
  # ============================================================================
  build-windows:
    name: Build Windows Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Windows Binaries
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist/amd64 dist/out
          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME="${INPUT_TAG:-v1.2.7}"
          fi
          VERSION_NUM="${TAG_NAME#v}"

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/amd64/mgy.exe ./cmd/gateway

          (cd dist/amd64 && zip -q -9 ../out/multigravity-windows-amd64.zip mgy.exe)

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-binaries
          path: dist/out/multigravity-windows-*.zip

  # ============================================================================
  # 3.5. 构建 Linux 二进制 (amd64 & arm64)
  # ============================================================================
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build Linux Binaries (amd64 & arm64)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist/amd64 dist/arm64 dist/out
          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME="${INPUT_TAG:-v1.2.7}"
          fi
          VERSION_NUM="${TAG_NAME#v}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/amd64/mgy ./cmd/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X 'main.Version=${VERSION_NUM}'" -o dist/arm64/mgy ./cmd/gateway
          chmod +x dist/amd64/mgy dist/arm64/mgy

          tar -czf dist/out/multigravity-linux-amd64.tar.gz -C dist/amd64 mgy
          tar -czf dist/out/multigravity-linux-arm64.tar.gz -C dist/arm64 mgy

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-binaries
          path: dist/out/multigravity-linux-*.tar.gz

  # ============================================================================
  # 4. 聚合所有构建产物并发布 GitHub Release
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Android Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-universal
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-binaries
          path: release-assets

      - name: Generate SHA-256 Checksums
        run: |
          (cd release-assets && rm -f checksums.txt && sha256sum -- * > checksums.txt)
          echo "✅ 已生成 release-assets/checksums.txt:"
          cat release-assets/checksums.txt

      - name: Resolve Release Metadata & Notes
        id: release_meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME="${INPUT_TAG:-v1.2.7}"
          fi

          # Any tag containing "-" (e.g. v1.2.8-beta.1, v1.2.8-rc.1, v1.2.8-alpha.1)
          # or explicit workflow_dispatch prerelease=true is published as a Pre-release
          # with make_latest=false so normal users on /releases/latest are never affected.
          IS_PRERELEASE="false"
          if [[ "$TAG_NAME" == *-* ]] || [ "$INPUT_PRERELEASE" = "true" ]; then
            IS_PRERELEASE="true"
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            MAKE_LATEST="false"
            if [ -s ".github/prerelease_notes.md" ]; then
              BODY_PATH=".github/prerelease_notes.md"
              GEN_NOTES="false"
            else
              mkdir -p release-meta
              BODY_PATH="release-meta/prerelease_body.md"
              cat > "$BODY_PATH" <<EOF
          > 🧪 **预发布测试版 / Pre-release Build (\`${TAG_NAME}\`)**
          >
          > - 此版本仅供内测与尝鲜体验，**不会推送给正式版用户**（\`mgy update\` / Android 应用内更新 / 一键安装脚本均自动跳过）。
          > - **网关更新至本测试版**：运行 \`mgy update ${TAG_NAME}\`；测试完毕后运行 \`mgy update\` 即可切回最新正式版。
          > - **Android 测试安装**：直接下载下方 \`Multigravity-${TAG_NAME}.apk\` 安装即可（与正式版同签名，可直接覆盖升级）。
          >
          > ---
          >
          > - This is a **Pre-release** build for testing only and **will not be pushed to stable users** (\`mgy update\`, Android in-app updater, and install scripts ignore pre-releases).
          > - **Gateway CLI**: run \`mgy update ${TAG_NAME}\` to install this build, or \`mgy update\` to return to the latest stable release.
          > - **Android**: download and install \`Multigravity-${TAG_NAME}.apk\` below (signed with the same release key for seamless upgrades).
          EOF
              GEN_NOTES="true"
            fi
          else
            MAKE_LATEST="true"
            BODY_PATH=".github/release_notes.md"
            GEN_NOTES="false"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "make_latest=${MAKE_LATEST}"
            echo "body_path=${BODY_PATH}"
            echo "generate_release_notes=${GEN_NOTES}"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Release metadata resolved: tag=${TAG_NAME}, prerelease=${IS_PRERELEASE}, make_latest=${MAKE_LATEST}, body_path=${BODY_PATH}, generate_release_notes=${GEN_NOTES}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "Multigravity ${{ steps.release_meta.outputs.tag_name }}"
          body_path: ${{ steps.release_meta.outputs.body_path }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
          generate_release_notes: ${{ steps.release_meta.outputs.generate_release_notes }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}

